name: My first task
description: Tell us how installing Phonebridge and running a first task went, whether it worked or not.
title: "First task: <recipe or task> on <device>"
labels: ["first-task"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying Phonebridge. This report is voluntary and public.
        **Please share no personal data:** no screenshots of messages, chats, feeds or accounts, and no names, handles, phone numbers or tokens. Text evidence (a result line, timings, error messages) is enough.
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - It worked
        - It worked after I fixed something (say what below)
        - It didn't work
    validations:
      required: true
  - type: input
    id: task
    attributes:
      label: Task or recipe you ran
      placeholder: "e.g. phonebridge check, or the prompt you gave your agent"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone model and iOS version
      placeholder: "e.g. iPhone 12, iOS 27.0.1"
    validations:
      required: true
  - type: input
    id: computer
    attributes:
      label: Mac model and macOS version
      placeholder: "e.g. MacBook Air M2, macOS 26.1"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed
      options:
        - uv sync in a clone
        - uv tool install from a clone
        - other
    validations:
      required: true
  - type: input
    id: minutes
    attributes:
      label: Minutes from install to first finished task (rough is fine)
      placeholder: "e.g. 12"
  - type: textarea
    id: friction
    attributes:
      label: Where setup was confusing or broke
      description: The most useful part of this report. The output of `phonebridge devices` and `phonebridge preflight <alias>` helps; check it for anything personal first.
      render: text
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence (optional)
      description: "Result lines, timings or error messages, e.g. the summary `phonebridge check` prints. Text only."
      render: text
  - type: checkboxes
    id: consent
    attributes:
      label: Before you submit
      options:
        - label: This report contains no screenshots of private content and no personal data about me or anyone else.
          required: true
        - label: The maintainers may count this report (by issue link) in public adoption numbers.
          required: false
