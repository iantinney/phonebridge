note: 'Instagram 454''s focused search field with the keyboard up (11-08, from real frames): the back chevron at the top
  left (no Cancel in 454), the search bar right of it (empty: the "Search with Meta AI" placeholder, which the fast OCR
  misreads, e.g. "Ci bearch with Meta Al"; or a typed query), Recent or matching rows under it, the iOS keyboard below.
  Matched by two templates, both required: search_field_start = the bar''s rounded start and its search glyph (it means
  "an Instagram search bar": 0.97-0.99 on every IG search bar, Explore included; best non-search frame 0.943) and
  keyboard_123 = the keyboard''s 123 key (0.966-0.969 with the keyboard up; at most 0.927 elsewhere), so a missed key row
  in the OCR can''t hide the keyboard. Not typing, on purpose: the focused bar with the keyboard dismissed (demo 015), a
  typed query''s results with the keyboard down (demo 008, 016), Explore, keyword pages, composers. Margins are about
  0.02: don''t lower the thresholds. Not covered by any stored frame: a keyboard in another context (DM, comment), a
  light-mode keyboard (fails closed). Offline: tw-phone + tw-verifier on 51 stored frames, OCR as stored and keys
  dropped; typed query with the keyboard up checked on composites only. back = the chevron (0.065 w, 0.082 h).'
