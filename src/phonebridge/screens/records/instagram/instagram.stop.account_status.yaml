id: instagram.stop.account_status
platform: instagram
bundle: com.burbn.instagram
kind: stop
appearance: any
match:
  ocr_any:
  - Account Status
  - Your account has been restricted
  - Features you can't use
  - can't be recommended
  - Your account was disabled
