note: 'VLM screen: This is the Instagram search/explore grid: a "Search with Meta
  AI" bar, filter chips (For you, Mindset and Motivation, Entrepreneurship), a grid
  of video thumbnails with view counts, and a bottom tab bar. It has no sheet, popup,
  or dialog to dismiss, and it is not a login, captcha, or action block. No known
  screen matches it, so the app is already on a normal browsable screen and no navigation
  is needed. Choosing none is the safest option. | action none '''' worked; context:
  run 4a035c81 | 10-19 (surfaces4): the match is the search bar + the ''For you''
  chip by position (OCR reads ''Meta AI'' as ''Meta Al'': the prefix is used), not
  the first thumbnails'' captions, so a new grid matches; a search with the keyboard
  open hides the chips and does not match. grid_tile = the middle tile of the first
  row (centre 0.50 w, 0.28 h, unscrolled; 3 columns of 0.333 w, rows ~0.206 h from
  0.179 h). The tap opens a post viewer (header ''Explore'', back chevron): NO real
  frame of it on this phone yet (the corpus ones are another phone''s layout), so
  its record and back target wait for the capture visit (docs/lanes/surfaces-capture-plan-4.md).
  avoid: the search bar + its saved-posts bookmark (0.93 w, 0.085 h), the chips, the
  tab bar. | 10-19 (task-agent): search_field = the search bar by its own OCR line
  (the match''s anchor); a tap opens the keyboard (instagram.search.typing, designed).
  A task''s tap on this named target is the control itself (run/do.py: zone-exempt,
  bounded by its box); the avoid band keeps feed gestures off it.'
